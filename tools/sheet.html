<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#151517;color:#ddd;font:12px sans-serif}canvas{display:block}</style><body><script src="../ui/engine.js"></script><script>
window.sheet = async (roles, S, onlyFirst, only) => {
  const E = CursoraEngine; let packs = await E.loadIndex('../packs/'); if (only) packs = packs.filter(p => only.includes(p.id));
  const rows = []; for (const p of packs) for (const v of (onlyFirst ? [p.variants[0]] : p.variants)) rows.push([p, v]);
  const W = 150 + roles.length * (S + 16), H = rows.length * (S + 16);
  const c = document.createElement('canvas'); c.width = W; c.height = H; document.body.appendChild(c); const x = c.getContext('2d');
  x.fillStyle = '#6b7280'; x.fillRect(0,0,W,H);
  for (let i = 0; i < rows.length; i++) { const [p, v] = rows[i]; x.fillStyle = '#fff'; x.font = '13px sans-serif'; x.fillText(p.id + '/' + v.id, 6, i*(S+16) + S/2 + 8);
    for (let j = 0; j < roles.length; j++) { const d = E.newDesign(p.id, v.id); d.global = { size: S };
      try { const r = await E.renderRole(d, roles[j], S); const X = 150 + j*(S+16), Y = i*(S+16)+8;
        x.strokeStyle='#999'; x.strokeRect(X-0.5,Y-0.5,S+1,S+1); x.drawImage(r.frames[0], X, Y); x.fillStyle = '#ff0040'; x.fillRect(X + r.hot[0]-1, Y + r.hot[1]-1, 3, 3);
      } catch (e) { x.fillStyle='red'; x.fillText('ERR', 150 + j*(S+16), i*(S+16)+20); console.log(p.id, roles[j], e.message); } } }
  return [W, H];
};
</script>
